  <script>
    (function() {
      // Particules
      const particlesContainer = document.getElementById('particles');
      if (particlesContainer) {
        for (let i = 0; i < 45; i++) {
          const p = document.createElement('div');
          p.classList.add('particle');
          p.style.left = Math.random() * 100 + '%';
          p.style.width = (Math.random() * 4 + 2) + 'px';
          p.style.height = p.style.width;
          p.style.animationDelay = Math.random() * 10 + 's';
          p.style.animationDuration = (Math.random() * 10 + 6) + 's';
          particlesContainer.appendChild(p);
        }
      }

      // Messages SVG
      const messages = [
        { icon: '<svg class="message-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/><circle cx="12" cy="12" r="3"/></svg>', text: 'Initialisation des modules' },
        { icon: '<svg class="message-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>', text: 'Chargement des composants' },
        { icon: '<svg class="message-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/><circle cx="12" cy="12" r="3"/></svg>', text: 'Préparation de l\'interface' },
        { icon: '<svg class="message-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>', text: 'Connexion sécurisée' },
        { icon: '<svg class="message-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 12v6a2 2 0 01-2 2H6a2 2 0 01-2-2v-6M4 5h16a2 2 0 012 2v1M4 5L2 7l2 2 M20 5l2 2-2 2"/></svg>', text: 'Synchronisation des données' },
        { icon: '<svg class="message-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/><circle cx="12" cy="12" r="3"/></svg>', text: 'Optimisation des performances' },
        { icon: '<svg class="message-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>', text: 'Finalisation' },
        { icon: '<svg class="message-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>', text: 'Bienvenue sur votre espace' }
      ];

      let msgIndex = 0;
      const msgContainer = document.getElementById('loadingMessages');
      if (msgContainer) {
        setInterval(() => {
          msgIndex = (msgIndex + 1) % messages.length;
          msgContainer.innerHTML = `<span class="message-badge">${messages[msgIndex].icon} ${messages[msgIndex].text}</span>`;
        }, 1300);
      }

      // Gestion de la progression
      let progress = 0;
      let isAngularReady = false;
      let isProgressComplete = false;
      let hasLoaderFaded = false;
      
      const progressEl = document.getElementById('progressPercent');
      const fillBar = document.querySelector('.progress-fill');
      const preloader = document.getElementById('preloader');
      
      function fadeOutLoader() {
        if (hasLoaderFaded) return;
        hasLoaderFaded = true;
        if (preloader) {
          preloader.classList.add('fade-out');
          setTimeout(() => preloader.remove(), 800);
        }
      }
      
      function checkAndFadeOut() {
        if (isProgressComplete && isAngularReady && !hasLoaderFaded) {
          fadeOutLoader();
        }
      }
      
      // Progression
      const interval = setInterval(() => {
        if (progress < 100) {
          progress += Math.random() * 8 + 3;
          if (progress > 100) progress = 100;
          if (progressEl) progressEl.textContent = Math.floor(progress) + '%';
          if (fillBar) fillBar.style.width = progress + '%';
          if (progress >= 100) {
            clearInterval(interval);
            isProgressComplete = true;
            checkAndFadeOut();
          }
        }
      }, 250);
      
      // Détection Angular
      const checkAngular = setInterval(() => {
        const appRoot = document.querySelector('app-root');
        if (appRoot && appRoot.children && appRoot.children.length > 0) {
          clearInterval(checkAngular);
          isAngularReady = true;
          checkAndFadeOut();
        }
      }, 100);
      
      // Fallback 10 secondes
      setTimeout(() => {
        if (!hasLoaderFaded) {
          isProgressComplete = true;
          isAngularReady = true;
          checkAndFadeOut();
        }
      }, 10000);
    })();
  </script>
